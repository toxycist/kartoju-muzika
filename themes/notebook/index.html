<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kartoju muziką</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <span class="masthead-mark" aria-hidden="true">&#9835;</span>
    <h1 class="masthead-title">kartoju muziką</h1>
    <div id="theme-switcher" class="theme-switcher">
      <label for="theme-select">theme</label>
      <select id="theme-select"></select>
    </div>
  </header>

  <main class="layout">
    <section class="pane pane-browse">
      <div class="controls">
        <div class="field">
          <label for="grade">grade</label>
          <select id="grade">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
          </select>
        </div>
        <div class="field">
          <label for="semester">semester</label>
          <select id="semester">
            <option>1</option>
            <option>2</option>
          </select>
        </div>
        <div class="field field-grow">
          <label for="category">category</label>
          <select id="category"></select>
        </div>
      </div>
      <div id="tree" class="tree"></div>
    </section>

    <section class="pane pane-player">
      <div class="controls controls-mode">
        <div class="field">
          <label for="mode">mode</label>
          <select id="mode">
            <option>learning</option>
            <option>practice</option>
            <option>test</option>
          </select>
        </div>
      </div>

      <div id="player" class="listening-player" style="display: none;">
        <audio controls style="width: 100%;">
          <source id="audio-source" type="audio/mpeg">
          your browser does not support audio
        </audio>
        <div id="now-playing" class="now-playing"></div>
      </div>

      <div id="practice-mode" class="mode-panel" style="display: none;">
        <div class="practice-controls">
          <div class="control-row">
            <label for="duration-input">duration (seconds)</label>
            <input id="duration-input" type="number" min="5" max="60" value="30">
          </div>
          <div class="control-row">
            <label for="id-filter-input">track ids filter</label>
            <input id="id-filter-input" type="text" placeholder="e.g., 01,02,03">
          </div>
          <div class="control-row">
            <label for="force-start-input">force start</label>
            <input id="force-start-input" type="text" placeholder="e.g., 01,05">
          </div>
          <div class="control-row control-row-buttons">
            <button id="practice-start-btn" class="btn-stamp">start</button>
            <button id="pause-btn" class="btn-stamp btn-stamp-quiet" style="display: none;">pause</button>
          </div>
        </div>
        <div id="practice-player" class="practice-player" style="display: none;">
          <div class="practice-input">
            <input id="guess-input" type="text" placeholder="enter track id" disabled>
            <button id="guess-btn" class="btn-stamp" disabled>guess</button>
          </div>
          <div id="feedback" class="feedback"></div>
        </div>
      </div>

      <div id="test-mode" class="mode-panel" style="display: none;">
        <div class="practice-controls">
          <div class="control-row">
            <label for="test-duration-input">duration (seconds)</label>
            <input id="test-duration-input" type="number" min="5" max="60" value="30">
          </div>
          <div class="control-row">
            <label for="test-count-input">number of songs</label>
            <input id="test-count-input" type="number" min="1" max="100" value="10">
          </div>
          <div class="control-row">
            <label for="test-id-filter-input">track ids filter</label>
            <input id="test-id-filter-input" type="text" placeholder="e.g., 01,02,03">
          </div>
          <div class="control-row">
            <label for="test-force-start-input">force start</label>
            <input id="test-force-start-input" type="text" placeholder="e.g., 01,05">
          </div>
          <button id="test-start-btn" class="btn-stamp">start</button>
          <button id="test-stop-btn" class="btn-stamp btn-stamp-quiet" style="display: none;">stop</button>
        </div>
        <div id="test-player" class="practice-player" style="display: none;">
          <div id="test-progress" class="test-progress"></div>
          <div class="practice-input">
            <input id="test-guess-input" type="text" placeholder="enter track id" disabled>
            <button id="test-guess-btn" class="btn-stamp" disabled>guess</button>
          </div>
          <div id="test-feedback" class="feedback"></div>
          <div id="test-results" class="test-results" style="display: none;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/theme-switcher.js"></script>
  <script src="/app.js"></script>
</body>
</html>
