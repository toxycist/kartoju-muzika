<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>split view</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pane">
    <div class="controls">
      <label>mode</label>
      <select id="mode">
        <option>learning</option>
        <option>practice</option>
        <option>test</option>
      </select>
    </div>
    <div class="controls">
      <label>grade</label>
      <select id="grade">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
      <label>semester</label>
      <select id="semester">
        <option>1</option>
        <option>2</option>
      </select>
      <label>category</label>
      <select id="category"></select>
    </div>
    <div id="tree"></div>
  </div>
  <div class="pane">
    <div id="player">
      <audio controls style="width: 100%;">
        <source id="audio-source" type="audio/mpeg">
        your browser does not support audio
      </audio>
      <div id="now-playing" style="margin-top: 10px; font-size: 14px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
