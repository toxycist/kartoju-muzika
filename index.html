<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>split view</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pane">
    <div class="controls">
      <label>grade</label>
      <select id="grade">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
      <label>semester</label>
      <select id="semester">
        <option>1</option>
        <option>2</option>
      </select>
      <label>category</label>
      <select id="category"></select>
    </div>
    <div id="tree"></div>
  </div>
  <div class="pane">
    <div class="controls">
      <label>mode</label>
      <select id="mode">
        <option>learning</option>
        <option>practice</option>
        <option>test</option>
      </select>
    </div>
    <div id="player" style="display: none;">
      <audio controls style="width: 100%;">
        <source id="audio-source" type="audio/mpeg">
        your browser does not support audio
      </audio>
      <div id="now-playing" style="margin-top: 10px; font-size: 14px;"></div>
    </div>
    <div id="practice-mode" style="display: none;">
      <div class="practice-controls">
        <div class="control-row">
          <label>duration (seconds)</label>
          <input id="duration-input" type="number" min="5" max="60" value="30">
        </div>
        <div class="control-row">
          <label>track ids filter</label>
          <input id="id-filter-input" type="text" placeholder="e.g., 01,02,03">
        </div>
        <div class="control-row">
          <button id="practice-start-btn">start</button>
          <button id="pause-btn" style="display: none;">pause</button>
        </div>
      </div>
      <div id="practice-player" style="display: none;">
        <div class="practice-info">
          <div id="practice-status">loading...</div>
        </div>
        <div class="practice-input">
          <input id="guess-input" type="text" placeholder="enter track id" disabled>
          <button id="guess-btn" disabled>guess</button>
        </div>
        <div id="feedback" style="margin-top: 10px;"></div>
      </div>
    </div>
    <div id="test-mode" style="display: none;">
      <div class="practice-controls">
        <div class="control-row">
          <label>duration (seconds)</label>
          <input id="test-duration-input" type="number" min="5" max="60" value="30">
        </div>
        <div class="control-row">
          <label>number of songs</label>
          <input id="test-count-input" type="number" min="1" max="100" value="10">
        </div>
        <div class="control-row">
          <label>track ids filter</label>
          <input id="test-id-filter-input" type="text" placeholder="e.g., 01,02,03">
        </div>
        <button id="test-start-btn">start</button>
      </div>
      <div id="test-player" style="display: none;">
        <div class="practice-info">
          <div id="test-status">loading...</div>
          <div id="test-progress" style="margin-top: 5px; font-size: 12px;"></div>
        </div>
        <div class="practice-input">
          <input id="test-guess-input" type="text" placeholder="enter track id" disabled>
          <button id="test-guess-btn" disabled>guess</button>
        </div>
        <div id="test-feedback" style="margin-top: 10px;"></div>
        <div id="test-results" style="display: none; margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px;"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
